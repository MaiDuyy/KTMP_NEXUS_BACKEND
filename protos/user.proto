syntax = "proto3";

package user;

service UserService {
  rpc GetUsersBatch (GetUsersRequest) returns (GetUsersResponse);
  rpc CheckBlocked (CheckBlockedRequest) returns (CheckBlockedResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (UserProfile);
  rpc GetAllUserIds (Empty) returns (GetAllUserIdsResponse);
  rpc ValidateWorkspaceQuota (QuotaRequest) returns (QuotaResponse);
  rpc CheckFriendship (CheckFriendshipRequest) returns (CheckFriendshipResponse);
  rpc CheckUserDepartment (CheckUserDepartmentRequest) returns (CheckUserDepartmentResponse);
  rpc CheckWorkspaceAccess (CheckWorkspaceAccessRequest) returns (CheckWorkspaceAccessResponse);
  rpc GetUserRolesAndScopes (UserRolesAndScopesRequest) returns (UserRolesAndScopesResponse);
}

message QuotaRequest {
  string userId = 1;
}

message QuotaResponse {
  bool allowed = 1;
  int32 used = 2;
  int32 limit = 3;
  string orgId = 4;
}

message Empty {}

message GetAllUserIdsResponse {
  repeated string ids = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUsersRequest {
  repeated string ids = 1;
}

message UserProfile {
  string id = 1;
  string name = 2;
  string email = 3;
  string avatar = 4;
  string status = 5;
  bool isOnline = 6;
  string userStatus = 7;
  string role = 8;
}

message GetUsersResponse {
  repeated UserProfile users = 1;
}

message CheckBlockedRequest {
  string user1Id = 1;
  string user2Id = 2;
}

message CheckBlockedResponse {
  bool isBlocked = 1;
  string blockerId = 2;
}

message CheckFriendshipRequest {
  string user1Id = 1;
  string user2Id = 2;
}

message CheckFriendshipResponse {
  bool isFriend = 1;
}

message CheckUserDepartmentRequest {
  string userId = 1;
  string departmentId = 2;
}

message CheckUserDepartmentResponse {
  bool belongsToDepartment = 1;
}

message CheckWorkspaceAccessRequest {
  string userId = 1;
  string workspaceId = 2;
  string departmentId = 3;
  string workspaceCreatedAt = 4;
}

message CheckWorkspaceAccessResponse {
  bool hasAccess = 1;
}

message UserRolesAndScopesRequest {
  string userId = 1;
}

message UserRolesAndScopesResponse {
  string globalRole = 1;
  repeated string assignedWorkspaceIds = 2;
  repeated string assignedDepartmentIds = 3;
}
