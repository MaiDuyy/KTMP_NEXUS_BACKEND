name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ main, develop ,dev ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1 # Change to your region
  ECR_REPOSITORY_PREFIX: ott-chat
  ECS_CLUSTER: ott-chat-cluster

jobs:
  deploy:
    name: Build and Push Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, ws-gateway, identity-service, messaging-service, file-service, notification-service]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build shared package
      run: |
        cd packages/shared
        npm install --legacy-peer-deps
        npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        SERVICE_NAME: ${{ matrix.service }}
      run: |
        # Build the image from the root context to include packages/shared
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}-$SERVICE_NAME:$IMAGE_TAG \
                     -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}-$SERVICE_NAME:latest \
                     -f services/$SERVICE_NAME/Dockerfile .
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}-$SERVICE_NAME:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}-$SERVICE_NAME:latest
        echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}-$SERVICE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update ECS service
      run: |
        aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} \
                               --service ${{ matrix.service }} \
                               --force-new-deployment
