syntax = "proto3";

package workspace;

service WorkspaceService {
  rpc GetMemberRole (GetMemberRoleRequest) returns (GetMemberRoleResponse);
  rpc DissolveWorkspace (DissolveWorkspaceRequest) returns (DissolveWorkspaceResponse);
  rpc RestoreWorkspace (RestoreWorkspaceRequest) returns (RestoreWorkspaceResponse);
  rpc ArchiveOneToOneChat (ArchiveOneToOneChatRequest) returns (ArchiveOneToOneChatResponse);
  rpc DeleteWorkspacePermanently (DeleteWorkspacePermanentlyRequest) returns (DeleteWorkspacePermanentlyResponse);
  rpc GetWorkspaceMetadata (GetWorkspaceMetadataRequest) returns (GetWorkspaceMetadataResponse);
  rpc GetWorkspaceMembers (GetWorkspaceMembersRequest) returns (GetWorkspaceMembersResponse);
  rpc CheckSharedWorkspaces (CheckSharedWorkspacesRequest) returns (CheckSharedWorkspacesResponse);
  rpc GetUserDMPartners (GetUserDMPartnersRequest) returns (GetUserDMPartnersResponse);
  rpc LeaveWorkspace (LeaveWorkspaceRequest) returns (LeaveWorkspaceResponse);
  rpc KickMember (KickMemberRequest) returns (KickMemberResponse);
  rpc GetExpiredDissolvedWorkspaces (GetExpiredDissolvedWorkspacesRequest) returns (GetExpiredDissolvedWorkspacesResponse);
  rpc GetWorkspaceCount (WorkspaceCountRequest) returns (WorkspaceCountResponse);
  rpc AddMember (AddMemberRequest) returns (AddMemberResponse);
}

message WorkspaceCountRequest {
  string ownerId = 1;
}

message WorkspaceCountResponse {
  int32 count = 1;
}

message GetMemberRoleRequest {
  string userId = 1;
  string workspaceId = 2;
}

message GetMemberRoleResponse {
  bool isMember = 1;
  string role = 2;
}

message DissolveWorkspaceRequest {
  string workspaceId = 1;
  string userId = 2;
  string workspaceNameConfirm = 3;
}

message DissolveWorkspaceResponse {
  bool success = 1;
}

message ArchiveOneToOneChatRequest {
  string user1Id = 1;
  string user2Id = 2;
}

message ArchiveOneToOneChatResponse {
  bool success = 1;
}

message RestoreWorkspaceRequest {
  string workspaceId = 1;
  string userId = 2;
}

message RestoreWorkspaceResponse {
  bool success = 1;
}

message DeleteWorkspacePermanentlyRequest {
  string workspaceId = 1;
}

message DeleteWorkspacePermanentlyResponse {
  bool success = 1;
}

message GetWorkspaceMetadataRequest {
  string workspaceId = 1;
}

message GetWorkspaceMetadataResponse {
  string id = 1;
  string name = 2;
  string status = 3;
  string ownerId = 4;
  string dissolvedAt = 5;
  int32 retentionDays = 6;
  string slug = 7;
}

message GetWorkspaceMembersRequest {
  string workspaceId = 1;
}

message GetWorkspaceMembersResponse {
  repeated string userIds = 1;
}

message CheckSharedWorkspacesRequest {
  string user1Id = 1;
  string user2Id = 2;
}

message CheckSharedWorkspacesResponse {
  bool hasSharedActiveWorkspace = 1;
  int32 sharedCount = 2;
}

message GetUserDMPartnersRequest {
  string userId = 1;
}

message GetUserDMPartnersResponse {
  repeated string partnerIds = 1;
}

message LeaveWorkspaceRequest {
  string workspaceId = 1;
  string userId = 2;
}

message LeaveWorkspaceResponse {
  bool success = 1;
}

message KickMemberRequest {
  string workspaceId = 1;
  string targetUserId = 2;
  string actorId = 3;
}

message KickMemberResponse {
  bool success = 1;
}

message GetExpiredDissolvedWorkspacesRequest {
  // Empty or could have parameters
}

message GetExpiredDissolvedWorkspacesResponse {
  repeated string workspaceIds = 1;
}

message AddMemberRequest {
  string workspaceId = 1;
  string userId = 2;
  string role = 3;
  string invitedBy = 4;
}

message AddMemberResponse {
  bool success = 1;
  string message = 2;
}
