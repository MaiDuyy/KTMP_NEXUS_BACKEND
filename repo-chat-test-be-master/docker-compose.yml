version: "3.8"

services:
  # ============= Infrastructure =============
  
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ott-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ott_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ott_password}
      POSTGRES_DB: ${POSTGRES_DB:-ott_chat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ott-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ott_user} -d ${POSTGRES_DB:-ott_chat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ott-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ott-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  nats:
    image: nats:2.10-alpine
    container_name: ott-nats
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    networks:
      - ott-network
    command: ["-js", "-m", "8222"]  # Enable JetStream + monitoring

  # ============= Gateway Services =============

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ott-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${API_GATEWAY_PORT:-3000}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3002}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      # CONSOLIDATED: auth + user + rbac → identity-service
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://identity-service:3010}
      - MESSAGING_SERVICE_URL=${MESSAGING_SERVICE_URL:-http://messaging-service:3020}
      - FILE_SERVICE_URL=${FILE_SERVICE_URL:-http://file-service:3014}
      - STATS_SERVICE_URL=${STATS_SERVICE_URL:-http://stats-service:3015}
      - AUDIT_SERVICE_URL=${AUDIT_SERVICE_URL:-http://audit-service:3017}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-http://notification-service:3019}
      - MESSAGING_GRPC_HOST=${MESSAGING_GRPC_HOST:-messaging-service}
      - MESSAGING_GRPC_PORT=${MESSAGING_GRPC_PORT:-50052}
      - IDENTITY_GRPC_HOST=${IDENTITY_GRPC_HOST:-identity-service}
      - IDENTITY_GRPC_PORT=${IDENTITY_GRPC_PORT:-50051}
      - SPRING_AI_URL=${SPRING_AI_URL:-http://host.docker.internal:8080}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - ott-network

  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    container_name: ott-ws-gateway
    ports:
      - "${WS_GATEWAY_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${WS_GATEWAY_PORT:-3001}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3002}
      # DEPRECATED: GROUP and CHAT now unified into MESSAGING
      # - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-http://chat-service:3013}
      # - GROUP_SERVICE_URL=${GROUP_SERVICE_URL:-http://group-service:3012}
      - MESSAGING_SERVICE_URL=${MESSAGING_SERVICE_URL:-http://messaging-service:3020}
      - MESSAGING_GRPC_HOST=${MESSAGING_GRPC_HOST:-messaging-service}
      - MESSAGING_GRPC_PORT=${MESSAGING_GRPC_PORT:-50052}
      - IDENTITY_GRPC_HOST=${IDENTITY_GRPC_HOST:-identity-service}
      - IDENTITY_GRPC_PORT=${IDENTITY_GRPC_PORT:-50051}
      - SPRING_AI_URL=${SPRING_AI_URL:-http://host.docker.internal:8080}
      # - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-secret-change-in-production}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - ott-network

  # ============= Core Services =============

  # CONSOLIDATED: auth + userorg + rbac → identity-service
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: ott-identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT:-3010}:3010"
      - "${IDENTITY_GRPC_PORT:-50051}:50051"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${IDENTITY_SERVICE_PORT:-3010}
      - IDENTITY_GRPC_PORT=${IDENTITY_GRPC_PORT:-50051}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-postgresql://ott_user:ott_password@postgres:5432/ott_chat?schema=auth}
      - USERORG_DATABASE_URL=${USERORG_DATABASE_URL:-postgresql://ott_user:ott_password@postgres:5432/ott_chat?schema=userorg}
      - RBAC_DATABASE_URL=${RBAC_DATABASE_URL:-postgresql://ott_user:ott_password@postgres:5432/ott_chat?schema=rbac}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
      - MESSAGING_GRPC_HOST=${MESSAGING_GRPC_HOST:-messaging-service}
      - MESSAGING_GRPC_PORT=${MESSAGING_GRPC_PORT:-50052}
      - IDENTITY_GRPC_HOST=${IDENTITY_GRPC_HOST:-identity-service}
      - IDENTITY_GRPC_PORT=${IDENTITY_GRPC_PORT:-50051}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - ott-network
    command: sh -c "npx prisma db push --schema=prisma/auth.prisma --accept-data-loss && npx prisma db push --schema=prisma/userorg.prisma --accept-data-loss && npx prisma db push --schema=prisma/rbac.prisma --accept-data-loss && npm run prisma:seed && node dist/index.js"

