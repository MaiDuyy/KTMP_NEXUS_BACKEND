  # ============= AI Voice Runtime =============

  voice-service:
    build:
      context: .
      dockerfile: services/voice-service/Dockerfile
    ports:
      - "${VOICE_SERVICE_PORT:-3035}:3035"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VOICE_SERVICE_PORT=3035
      - MEETING_VOICE_ENABLED=true
      - VOICE_METRICS_ENABLED=true
      - VOICE_STREAMING_ENABLED=true
      - VOICE_STREAM_ALLOWED_ORIGINS=${VOICE_STREAM_ALLOWED_ORIGINS:-http://localhost:3002}
      - VOICE_STREAMING_TTS_ENABLED=true
      - VOICE_STREAMING_OUTPUT_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - VOICE_TURN_TOKEN_SECRET=${VOICE_TURN_TOKEN_SECRET}
      - VOICE_INTERNAL_SERVICE_KEY=${VOICE_INTERNAL_SERVICE_KEY}
      - VOICE_CONTROL_INTERNAL_URL=http://ws-gateway:3001/internal/voice
      - MEETING_AI_INTERNAL_URL=http://ai-knowledge:8080/internal/meeting-ai
      - MEETING_AI_INTERNAL_SERVICE_KEY=${MEETING_AI_INTERNAL_SERVICE_KEY}
      - MEETING_AI_STREAM_FIRST_EVENT_TIMEOUT_MS=${MEETING_AI_STREAM_FIRST_EVENT_TIMEOUT_MS:-30000}
      - MEETING_AI_STREAM_IDLE_EVENT_TIMEOUT_MS=${MEETING_AI_STREAM_IDLE_EVENT_TIMEOUT_MS:-30000}
      - VOICE_STT_PROVIDER=${VOICE_STT_PROVIDER:-google}
      - VOICE_TTS_PROVIDER=${VOICE_TTS_PROVIDER:-google}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - GOOGLE_STT_MODEL=${GOOGLE_STT_MODEL:-chirp_2}
      - GOOGLE_STT_LANGUAGE=${GOOGLE_STT_LANGUAGE:-vi-VN}
      - GOOGLE_TTS_VOICE=${GOOGLE_TTS_VOICE:-vi-VN-Chirp3-HD-Charon}
      - GOOGLE_TTS_AUDIO_ENCODING=${GOOGLE_TTS_AUDIO_ENCODING:-LINEAR16}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_STT_MODEL=${ELEVENLABS_STT_MODEL:-scribe_v2}
      - ELEVENLABS_STREAMING_STT_MODEL=${ELEVENLABS_STREAMING_STT_MODEL:-scribe_v2_realtime}
      - ELEVENLABS_MAX_QUEUED_BYTES=${ELEVENLABS_MAX_QUEUED_BYTES:-8388608}
      - ELEVENLABS_TTS_MODEL=${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      - ELEVENLABS_TTS_VOICE_ID=${ELEVENLABS_TTS_VOICE_ID:-}
      - ELEVENLABS_LANGUAGE=${ELEVENLABS_LANGUAGE:-vi}
      - ELEVENLABS_OUTPUT_FORMAT=${ELEVENLABS_OUTPUT_FORMAT:-pcm_24000}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - ${APPDATA}/gcloud:/home/voice/.config/gcloud:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ott-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3019}:3019"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${NOTIFICATION_SERVICE_PORT:-3019}
      - DATABASE_URL=${NOTIFICATION_DATABASE_URL:-postgresql://ott_user:ott_password@postgres:5432/ott_chat?schema=notification}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - ott-network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

networks:
  ott-network:
    name: ktmp_nexus_backend_ott-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  knowledge_uploads:

