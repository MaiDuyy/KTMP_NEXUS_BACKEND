  # ============= UNIFIED: messaging-service (chat + group) =============

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging-service/Dockerfile
    ports:
      - "${MESSAGING_SERVICE_PORT:-3020}:3020"
      - "${MESSAGING_GRPC_PORT:-50052}:50052"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${MESSAGING_SERVICE_PORT:-3020}
      - DATABASE_URL=${MESSAGING_DATABASE_URL:-postgresql://ott_user:ott_password@postgres:5432/ott_chat?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://identity-service:3010}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - IDENTITY_GRPC_HOST=${IDENTITY_GRPC_HOST:-identity-service}
      - IDENTITY_GRPC_PORT=${IDENTITY_GRPC_PORT:-50051}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      identity-service:
        condition: service_started
    networks:
      - ott-network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    ports:
      - "${FILE_SERVICE_PORT:-3014}:3014"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${FILE_SERVICE_PORT:-3014}
      - DATABASE_URL=${FILES_DATABASE_URL:-postgresql://ott_user:ott_password@postgres:5432/ott_chat?schema=files}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      # - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      # - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      # - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - ENABLE_JOB_QUEUE=true
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - ott-network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

